name: Build & Release APK

# Disparo automático (push) DESACTIVADO a propósito. El build en CI falla por un
# problema de larga data al evaluar el proyecto ':jni'
# (path_provider_android -> jni/jni_flutter -> "Could not find method kotlin()")
# que NO ocurre en el build local. La app se compila y distribuye en LOCAL
# (carpeta APK_BUILDS/), asi que este workflow queda SOLO manual para no generar
# un correo de fallo en cada push. Para reactivar el push hay que resolver antes
# el build de ':jni' en CI. Detalle en DOCUMENTACION/MAESTRO/ESTADO_NOTIFICACION_BIENESTAR.md (§7).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fijada a la MISMA versión que compila en local. En 'channel: stable' a
      # secas, CI cogía una Flutter más nueva y fallaba con
      # "Could not find method kotlin() ... project ':jni'" (deriva de versión).
      - name: Setup Flutter (pinned 3.44.2)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      # Versión desde pubspec (antes estaba hardcodeada a v4.6).
      - name: Extract version from pubspec
        id: ver
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ritmooptimo-v${{ steps.ver.outputs.version }}.apk

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ritmooptimo-apk-v${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/ritmooptimo-v${{ steps.ver.outputs.version }}.apk
          retention-days: 90

      # Best-effort: si el secreto SSH no está o Hostinger rechaza, NO tumba el
      # run (el artifact de arriba ya es el respaldo). Evita el spam de fallos.
      - name: Deploy APK to Hostinger via SSH (best-effort)
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 82.198.229.25
          port: 65002
          username: u323441816
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          source: build/app/outputs/flutter-apk/ritmooptimo-v${{ steps.ver.outputs.version }}.apk
          target: /home/u323441816/domains/ritmooptimo.tech/apk/
          strip_components: 4
